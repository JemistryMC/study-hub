name: Exo CI — Build, Lint, Unit, PGlite, PostgreSQL 16 & Chromium

on:
  push:
    branches:
      - main
      - Deploying
      - "fix/**"
    paths-ignore:
      - "reports/**"
      - "**/*.md"
      - "**/*.patch"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "reports/**"
      - "**/*.md"
      - "**/*.patch"

jobs:
  verify:
    name: Build, Lint & Full Verification Suite (PostgreSQL 16 + Chromium)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: supabase_admin_disposable_pass
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: "--set=cluster_name=exo_disposable_pg16"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U supabase_admin -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PG16_DATABASE_URL: postgresql://supabase_admin:supabase_admin_disposable_pass@127.0.0.1:5432/postgres

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Deterministic Dependencies (npm ci)
        run: npm ci

      - name: Install Headless Chromium for Playwright E2E
        run: npm run test:setup

      - name: Run Syntax & Lint Verification
        run: npm run lint

      - name: Run Production Build
        run: npm run build

      - name: 1. Run Production Cryptography & Static Security Audit
        run: npm run test:static

      - name: 2. Run Pure Unit & Asynchronous Logic Isolation Suites
        run: npm run test:unit

      - name: 3. Run Embedded PostgreSQL Compatibility Suite (PGlite WASM)
        run: npm run test:pglite

      - name: 4. Run Real PostgreSQL 16 Concurrency & 10-Point Schema Parity Suite
        run: npm run test:pg16

      - name: 5. Run Real Headless Chromium + IndexedDB Browser E2E Suite
        run: npm run test:e2e

      - name: 6. Verify Unified Test Runner (npm test -> run_all_tests.js)
        run: npm test
